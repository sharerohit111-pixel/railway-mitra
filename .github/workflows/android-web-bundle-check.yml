name: Android packaging smoke test

on:
  push:
    branches:
      - feature/android-app-shell
    paths:
      - "android-wrapper/**"
      - ".github/workflows/android-web-bundle-check.yml"
      - "app.html"
      - "assets/**"
      - "config/**"
      - "employee-benefits-calculators/**"
      - "features/**"
      - "guides/**"
      - "install/**"
      - "other-exams/**"
      - "manifest.json"
      - "service-worker.js"
  pull_request:
    branches:
      - main
    paths:
      - "android-wrapper/**"
      - ".github/workflows/android-web-bundle-check.yml"
      - "app.html"
      - "assets/**"
      - "config/**"
      - "employee-benefits-calculators/**"
      - "features/**"
      - "guides/**"
      - "install/**"
      - "other-exams/**"
      - "manifest.json"
      - "service-worker.js"

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-wrapper
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android workspace dependencies
        run: npm install
      - name: Prepare local Android web bundle
        run: npm run build:web
      - name: Verify required app entry points
        run: |
          test -f web/app.html
          test -f web/features/auth/login.html
          test -f web/assets/js/auth-guard.js
          test -f web/assets/js/firebase.js
      - name: Generate native Android project
        run: npx cap add android
      - name: Sync Capacitor Android project
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload debug APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: railway-mitra-android-debug
          path: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
