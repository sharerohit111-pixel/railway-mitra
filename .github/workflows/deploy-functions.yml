
name: Deploy Railway Mitra Cloud Functions

on:
  workflow_dispatch:
    inputs:
      confirm_project:
        description: "Type railway-mitra to confirm deployment"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy-functions:
    if: ${{ inputs.confirm_project == 'railway-mitra' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate to Google Cloud using WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Install Functions dependencies
        run: npm --prefix functions install --no-audit --no-fund

      - name: Check Functions syntax
        run: npm --prefix functions run lint

      - name: Deploy Firebase Cloud Functions
        run: npx --yes firebase-tools@latest deploy --only functions:deleteMyAccount --project railway-mitra --non-interactive
        
