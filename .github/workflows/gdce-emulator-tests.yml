name: GDCE Emulator Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "features/exams/**"
      - "functions/**"
      - "firebase.json"
      - "firestore.indexes.json"
      - ".github/workflows/gdce-emulator-tests.yml"
  push:
    branches: [integration/main-safe-gdce-admin]
    paths:
      - "features/exams/**"
      - "functions/**"
      - "firebase.json"
      - "firestore.indexes.json"
      - ".github/workflows/gdce-emulator-tests.yml"

permissions:
  contents: read

jobs:
  gdce-emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21 for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Functions dependencies
        run: npm --prefix functions install --no-audit --no-fund

      - name: Check Functions syntax
        run: npm --prefix functions run lint

      - name: Run GDCE backend tests in local emulators
        run: npx --yes firebase-tools@latest emulators:exec --project demo-railway-mitra --only auth,firestore,functions "npm --prefix functions test"
