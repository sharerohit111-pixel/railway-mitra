name: Inspect CC0 Indian Railways Track Geometry

on:
  pull_request:
    paths:
      - '.github/workflows/ir-tracks-dataset-inspection.yml'
  push:
    branches: ['feat/train-gps-location-alert-v1']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-ir-tracks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download pinned CC0 IR_Tracks release asset
        run: |
          set -euo pipefail
          mkdir -p gis-inspection
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://github.com/yashveeeeeeer/india-geodata/releases/download/infra/railways/IR_Tracks.geojsonl.7z' \
            --output gis-inspection/IR_Tracks.geojsonl.7z
          sha256sum gis-inspection/IR_Tracks.geojsonl.7z | tee gis-inspection/source.sha256
          stat --printf='Compressed bytes: %s\n' gis-inspection/IR_Tracks.geojsonl.7z
      - name: Validate archive and extract GeoJSONL
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes p7zip-full
          7z t gis-inspection/IR_Tracks.geojsonl.7z
          7z x gis-inspection/IR_Tracks.geojsonl.7z -ogis-inspection/extracted -y
          find gis-inspection/extracted -type f -maxdepth 3 -print
      - name: Inspect track features in a broad Lalgarh–Phalodi search envelope
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("gis-inspection/extracted")
          sources = list(root.rglob("*.geojsonl"))
          if not sources:
              raise SystemExit("Archive is valid but contains no .geojsonl file")
          # Broad candidate-search envelope only; NOT a route or track geometry.
          west, south, east, north = 71.5, 26.5, 74.5, 28.5

          def coordinates(value):
              if isinstance(value, (list, tuple)):
                  if len(value) >= 2 and all(isinstance(v, (int, float)) for v in value[:2]):
                      yield (float(value[0]), float(value[1]))
                  else:
                      for child in value:
                          yield from coordinates(child)

          total = 0
          candidates = 0
          geometry_types = {}
          property_keys = set()
          output = Path("gis-inspection/ir_tracks_corridor_candidates.geojsonl")
          with output.open("w", encoding="utf-8") as out:
              for source in sources:
                  with source.open(encoding="utf-8") as stream:
                      for line_no, line in enumerate(stream, 1):
                          if not line.strip():
                              continue
                          total += 1
                          try:
                              feature = json.loads(line)
                          except Exception as exc:
                              raise SystemExit(f"Invalid GeoJSON at {source}:{line_no}: {exc}")
                          if not isinstance(feature, dict):
                              continue
                          props = feature.get("properties") or {}
                          property_keys.update(map(str, props.keys()))
                          geom = feature.get("geometry") or {}
                          kind = geom.get("type", "null")
                          geometry_types[kind] = geometry_types.get(kind, 0) + 1
                          pts = list(coordinates(geom.get("coordinates")))
                          if pts and any(west <= x <= east and south <= y <= north for x, y in pts):
                              candidates += 1
                              out.write(json.dumps(feature, ensure_ascii=False, separators=(",", ":")) + "\n")

          summary = {
              "source_archive": "IR_Tracks.geojsonl.7z",
              "search_envelope_wgs84": {"west": west, "south": south, "east": east, "north": north},
              "warning": "Envelope is only for candidate discovery; it is not a verified railway route.",
              "total_features": total,
              "candidate_features_with_vertices_in_envelope": candidates,
              "geometry_types": geometry_types,
              "property_keys": sorted(property_keys),
              "candidate_file": output.name,
              "source_files": [str(p) for p in sources],
          }
          Path("gis-inspection/inspection-summary.json").write_text(
              json.dumps(summary, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          if total == 0:
              raise SystemExit("Dataset contained zero features")
          PY
      - name: Upload inspected geometry for route continuity analysis
        uses: actions/upload-artifact@v4
        with:
          name: ir-tracks-corridor-inspection
          path: |
            gis-inspection/source.sha256
            gis-inspection/inspection-summary.json
            gis-inspection/ir_tracks_corridor_candidates.geojsonl
          if-no-files-found: error
          retention-days: 7
