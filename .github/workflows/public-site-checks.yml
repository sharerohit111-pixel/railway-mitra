name: Public Site Checks

on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.html'
      - 'about.html'
      - 'contact.html'
      - 'disclaimer.html'
      - 'guides/**'
      - 'features/auth/login.js'
      - 'features/privacy/**'
      - 'features/where-is-your-train/**'
      - 'appwrite/functions/train-movement-api/**'
      - 'manifest.json'
      - 'service-worker.js'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/public-site-checks.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.html'
      - 'about.html'
      - 'contact.html'
      - 'disclaimer.html'
      - 'guides/**'
      - 'features/auth/login.js'
      - 'features/privacy/**'
      - 'features/where-is-your-train/**'
      - 'appwrite/functions/train-movement-api/**'
      - 'manifest.json'
      - 'service-worker.js'
      - 'robots.txt'
      - 'sitemap.xml'

jobs:
  public-site-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax for public and train modules
        run: |
          node --check features/auth/login.js
          node --check features/where-is-your-train/train.js
          node --check features/where-is-your-train/proximity-engine.js
          node --test features/where-is-your-train/tests/proximity-engine.test.js
          node --check appwrite/functions/train-movement-api/src/main.js
      - name: Verify train route station chainage consistency
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files = ['features/where-is-your-train/train.js', 'appwrite/functions/train-movement-api/src/main.js']
          arrays = []
          for name in files:
              text = Path(name).read_text()
              match = re.search(r'const ROUTE=(\[.*?\]);', text)
              if not match:
                  raise SystemExit(f'ROUTE array missing in {name}')
              arrays.append(match.group(1))
          if arrays[0] != arrays[1]:
              raise SystemExit('Frontend and backend train route chainage arrays differ')
          print('Train route chainage arrays match')
          PY
      - name: Validate sitemap XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml'); print('Sitemap XML is valid')"
      - name: Validate PWA manifest and public pages
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required = [
              'index.html', 'app.html', 'about.html', 'contact.html',
              'disclaimer.html', 'guides/index.html',
              'guides/allowance-basics.html',
              'guides/track-maintenance-reference.html',
              'guides/calculator-checklist.html',
              'features/privacy/index.html', 'robots.txt', 'sitemap.xml'
          ]
          missing = [p for p in required if not Path(p).is_file()]
          if missing:
              raise SystemExit('Missing public-site files: ' + ', '.join(missing))
          manifest = json.loads(Path('manifest.json').read_text())
          assert manifest.get('start_url') == './app.html', 'PWA must launch authenticated app.html'
          home = Path('index.html').read_text()
          app = Path('app.html').read_text()
          service_worker = Path('service-worker.js').read_text()
          assert 'name="description"' in home
          assert 'auth-guard.js' in app, 'Authenticated app guard missing'
          assert 'new URL("./app.html", self.registration.scope).href' in service_worker, 'Offline navigation must fall back to app.html'
          assert 'sign in' in home.lower() or 'sign-in' in home.lower()
          assert 'https://railwaymitra.com/' in home, 'Custom-domain canonical URL missing'
          public_pages = ['index.html', 'about.html', 'contact.html', 'disclaimer.html', 'guides/index.html', 'guides/allowance-basics.html', 'guides/track-maintenance-reference.html', 'guides/calculator-checklist.html']
          for page in public_pages:
              content = Path(page).read_text()
              assert 'href="/' not in content and 'src="/' not in content, f'Root-relative asset or link found in {page}'
          assert 'Sitemap: https://railwaymitra.com/sitemap.xml' in Path('robots.txt').read_text(), 'Custom-domain sitemap declaration missing'
          assert Path('features/home-explore/home-explore.js').is_file(), 'Explore Features module missing'
          assert Path('features/home-explore/home-explore.css').is_file(), 'Explore Features styles missing'
          assert 'features/home-explore/home-explore.js' in app and 'features/home-explore/home-explore.css' in app, 'Explore Features assets are not wired into app.html'
          for route in ['features/salary/index.html', 'features/income-tax/index.html', 'employee-benefits-calculators/index.html', 'features/retirement/index.html', 'features/pay-commission-8th/index.html', 'features/allowances/index.html', 'features/arrears/index.html', 'features/nh-holidays/index.html', 'features/duty-diary/index.html', 'features/personal-diary/index.html', 'features/profile/index.html', 'features/rules/index.html', 'features/p-way-manuals/index.html', 'features/p-way-quick-reference/index.html', 'features/p-way-civil-engineering-tools/index.html', 'features/updates/index.html', 'features/map/index.html', 'features/compliance/index.html', 'features/settings/index.html']:
              assert Path(route).is_file(), f'Explore Features route missing: {route}'
          print('Public pages and PWA manifest checks passed')
          PY

  inspect-ir-tracks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned CC0 IR_Tracks release asset
        run: |
          set -euo pipefail
          mkdir -p gis-inspection
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://github.com/yashveeeeeeer/india-geodata/releases/download/infra/railways/IR_Tracks.geojsonl.7z' \
            --output gis-inspection/IR_Tracks.geojsonl.7z
          sha256sum gis-inspection/IR_Tracks.geojsonl.7z | tee gis-inspection/source.sha256
          stat --printf='Compressed bytes: %s\n' gis-inspection/IR_Tracks.geojsonl.7z
      - name: Validate archive and extract GeoJSONL
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes p7zip-full
          7z t gis-inspection/IR_Tracks.geojsonl.7z
          7z x gis-inspection/IR_Tracks.geojsonl.7z -ogis-inspection/extracted -y
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://github.com/yashveeeeeeer/india-geodata/releases/download/infra/railways/IR_Stations.geojsonl.7z' \
            --output gis-inspection/IR_Stations.geojsonl.7z
          sha256sum gis-inspection/IR_Stations.geojsonl.7z | tee gis-inspection/stations-source.sha256
          7z t gis-inspection/IR_Stations.geojsonl.7z
          7z x gis-inspection/IR_Stations.geojsonl.7z -ogis-inspection/stations -y
      - name: Inspect candidate track features near Lalgarh–Phalodi
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          sources = list(Path('gis-inspection/extracted').rglob('*.geojsonl'))
          if not sources:
              raise SystemExit('Archive contains no GeoJSONL file')
          # Broad discovery envelope only; never treated as a route.
          west, south, east, north = 71.5, 26.5, 74.5, 28.5
          def points(value):
              if isinstance(value, (list, tuple)):
                  if len(value) >= 2 and all(isinstance(v, (int, float)) for v in value[:2]):
                      yield float(value[0]), float(value[1])
                  else:
                      for child in value:
                          yield from points(child)
          total = candidates = 0
          geometry_types, property_keys = {}, set()
          output = Path('gis-inspection/ir_tracks_corridor_candidates.geojsonl')
          with output.open('w', encoding='utf-8') as out:
              for source in sources:
                  with source.open(encoding='utf-8') as stream:
                      for line_no, line in enumerate(stream, 1):
                          if not line.strip():
                              continue
                          total += 1
                          feature = json.loads(line)
                          props = feature.get('properties') or {}
                          property_keys.update(map(str, props))
                          geom = feature.get('geometry') or {}
                          kind = geom.get('type', 'null')
                          geometry_types[kind] = geometry_types.get(kind, 0) + 1
                          coords = list(points(geom.get('coordinates')))
                          if coords and max(x for x, _ in coords) >= west and min(x for x, _ in coords) <= east and max(y for _, y in coords) >= south and min(y for _, y in coords) <= north:
                              candidates += 1
                              out.write(json.dumps(feature, ensure_ascii=False, separators=(',', ':')) + '\n')
          station_files = list(Path('gis-inspection/stations').rglob('*.geojsonl'))
          if not station_files:
              raise SystemExit('IR_Stations archive contains no GeoJSONL file')
          station_features = []
          station_keys = set()
          for source in station_files:
              with source.open(encoding='utf-8') as stream:
                  for line in stream:
                      if not line.strip():
                          continue
                      station = json.loads(line)
                      geom = station.get('geometry') or {}
                      coords = list(points(geom.get('coordinates')))
                      if coords and west <= coords[0][0] <= east and south <= coords[0][1] <= north:
                          station_features.append(station)
                          station_keys.update(map(str, (station.get('properties') or {}).keys()))
          station_output = Path('gis-inspection/ir_stations_corridor_candidates.geojsonl')
          station_output.write_text(''.join(json.dumps(x, ensure_ascii=False, separators=(',', ':')) + '\n' for x in station_features))
          summary = {
              'source_archive': 'IR_Tracks.geojsonl.7z',
              'station_source_archive': 'IR_Stations.geojsonl.7z',
              'station_features_in_discovery_envelope': len(station_features),
              'station_property_keys': sorted(station_keys),
              'search_envelope_wgs84': {'west': west, 'south': south, 'east': east, 'north': north},
              'warning': 'Discovery envelope only; not a verified railway route or chainage reference.',
              'total_features': total,
              'candidate_features': candidates,
              'geometry_types': geometry_types,
              'property_keys': sorted(property_keys),
              'candidate_file': output.name,
          }
          Path('gis-inspection/inspection-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          if total == 0:
              raise SystemExit('Dataset contains zero features')
          PY
      - name: Run conservative track geometry continuity audit
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check shapely pyproj
          python scripts/inspect-ir-track-geometry.py --tracks gis-inspection/ir_tracks_corridor_candidates.geojsonl --stations gis-inspection/ir_stations_corridor_candidates.geojsonl --output gis-inspection/track-geometry-qa.json
      - name: Upload inspected corridor geometries
        uses: actions/upload-artifact@v4
        with:
          name: ir-tracks-corridor-inspection
          path: |
            gis-inspection/source.sha256
            gis-inspection/stations-source.sha256
            gis-inspection/inspection-summary.json
            gis-inspection/ir_tracks_corridor_candidates.geojsonl
            gis-inspection/ir_stations_corridor_candidates.geojsonl
            gis-inspection/track-geometry-qa.json
          if-no-files-found: error
          retention-days: 7
