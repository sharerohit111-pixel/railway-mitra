name: Public Site Checks

on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.html'
      - 'about.html'
      - 'contact.html'
      - 'disclaimer.html'
      - 'guides/**'
      - 'features/auth/login.js'
      - 'features/privacy/**'
      - 'manifest.json'
      - 'service-worker.js'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/public-site-checks.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.html'
      - 'about.html'
      - 'contact.html'
      - 'disclaimer.html'
      - 'guides/**'
      - 'features/auth/login.js'
      - 'features/privacy/**'
      - 'manifest.json'
      - 'service-worker.js'
      - 'robots.txt'
      - 'sitemap.xml'

jobs:
  public-site-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check login JavaScript syntax
        run: node --check features/auth/login.js
      - name: Validate sitemap XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml'); print('Sitemap XML is valid')"
      - name: Validate PWA manifest and public pages
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required = [
              'index.html', 'app.html', 'about.html', 'contact.html',
              'disclaimer.html', 'guides/index.html',
              'guides/allowance-basics.html',
              'guides/track-maintenance-reference.html',
              'guides/calculator-checklist.html',
              'features/privacy/index.html', 'robots.txt', 'sitemap.xml'
          ]
          missing = [p for p in required if not Path(p).is_file()]
          if missing:
              raise SystemExit('Missing public-site files: ' + ', '.join(missing))
          manifest = json.loads(Path('manifest.json').read_text())
          assert manifest.get('start_url') == './app.html', 'PWA must launch authenticated app.html'
          home = Path('index.html').read_text()
          app = Path('app.html').read_text()
          service_worker = Path('service-worker.js').read_text()
          assert 'name="description"' in home
          assert 'auth-guard.js' in app, 'Authenticated app guard missing'
          assert 'new URL("./app.html", self.registration.scope).href' in service_worker, 'Offline navigation must fall back to app.html'
          assert 'sign in' in home.lower() or 'sign-in' in home.lower()
          assert 'https://railwaymitra.com/' in home, 'Custom-domain canonical URL missing'
          public_pages = ['index.html', 'about.html', 'contact.html', 'disclaimer.html', 'guides/index.html', 'guides/allowance-basics.html', 'guides/track-maintenance-reference.html', 'guides/calculator-checklist.html']
          for page in public_pages:
              content = Path(page).read_text()
              assert 'href="/' not in content and 'src="/' not in content, f'Root-relative asset or link found in {page}'
          assert 'Sitemap: https://railwaymitra.com/sitemap.xml' in Path('robots.txt').read_text(), 'Custom-domain sitemap declaration missing'
          assert Path('features/home-explore/home-explore.js').is_file(), 'Explore Features module missing'
          assert Path('features/home-explore/home-explore.css').is_file(), 'Explore Features styles missing'
          assert 'features/home-explore/home-explore.js' in app and 'features/home-explore/home-explore.css' in app, 'Explore Features assets are not wired into app.html'
          for route in ['features/salary/index.html', 'features/income-tax/index.html', 'employee-benefits-calculators/index.html', 'features/retirement/index.html', 'features/pay-commission-8th/index.html', 'features/allowances/index.html', 'features/arrears/index.html', 'features/nh-holidays/index.html', 'features/duty-diary/index.html', 'features/personal-diary/index.html', 'features/profile/index.html', 'features/rules/index.html', 'features/p-way-manuals/index.html', 'features/p-way-quick-reference/index.html', 'features/p-way-civil-engineering-tools/index.html', 'features/updates/index.html', 'features/map/index.html', 'features/compliance/index.html', 'features/settings/index.html']:
              assert Path(route).is_file(), f'Explore Features route missing: {route}'
          print('Public pages and PWA manifest checks passed')
          PY
