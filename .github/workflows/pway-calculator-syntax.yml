name: P-Way calculator syntax checks

on:
  push:
    branches:
      - feature/test-series-cloud-access
    paths:
      - "features/p-way-civil-engineering-tools/track-fittings-calculator/script.js"
      - "features/p-way-civil-engineering-tools/cant-safe-speed-calculator/script.js"
      - "features/p-way-civil-engineering-tools/cant-safe-speed-calculator/tests/**"
      - ".github/workflows/pway-calculator-syntax.yml"
  pull_request:
    paths:
      - "features/p-way-civil-engineering-tools/track-fittings-calculator/script.js"
      - "features/p-way-civil-engineering-tools/cant-safe-speed-calculator/script.js"
      - ".github/workflows/pway-calculator-syntax.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check track fittings calculator syntax
        run: node --check features/p-way-civil-engineering-tools/track-fittings-calculator/script.js
      - name: Check cant and safe speed calculator syntax
        run: node --check features/p-way-civil-engineering-tools/cant-safe-speed-calculator/script.js
      - name: Run cant and safe speed numerical regression tests
        run: node --test features/p-way-civil-engineering-tools/cant-safe-speed-calculator/tests/*.test.js
