name: Automatic Railway News Sync

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/sync-railway-news.py"
      - ".github/workflows/railway-news-sync.yml"

permissions:
  contents: write

concurrency:
  group: railway-news-sync
  cancel-in-progress: false

jobs:
  sync-official-railway-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch and verify new PIB Railway releases
        run: python scripts/sync-railway-news.py
      - name: Commit feed only when it changed
        run: |
          if git diff --quiet -- features/updates/notices.json; then
            echo "No new official Railway releases."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/updates/notices.json
          git commit -m "chore(updates): sync official Railway news"
          git push
