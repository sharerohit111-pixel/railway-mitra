name: Automatic Railway Updates Sync

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: railway-updates-sync
  cancel-in-progress: false

jobs:
  sync-official-notices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Railway Mitra
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Collect and publish official Railway Board press releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/sync_railway_updates.py
