name: Test Series CBT emulator tests

on:
  push:
    branches:
      - feature/test-series-cloud-access
    paths:
      - "features/test-series/cloud/functions/**"
      - "features/test-series/cloud/firestore.rules"
      - "features/test-series/cloud/README.md"
      - "features/test-series/cloud/firebase-emulator-config.mjs"
      - "features/test-series/student/**"
      - "firebase.json"
      - "firebase.test-series-cbt-emulator.json"
      - ".github/workflows/test-series-cbt-emulator.yml"
  pull_request:
    paths:
      - "features/test-series/cloud/functions/**"
      - "features/test-series/cloud/firestore.rules"
      - "features/test-series/cloud/README.md"
      - "features/test-series/cloud/firebase-emulator-config.mjs"
      - "features/test-series/student/**"
      - "firebase.json"
      - "firebase.test-series-cbt-emulator.json"
      - ".github/workflows/test-series-cbt-emulator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cbt-emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate isolated CBT emulator configuration
        run: |
          node - <<'NODE'
          const config = require("./firebase.test-series-cbt-emulator.json");
          const functions = config.functions || [];
          if (
            functions.length !== 1 ||
            functions[0].codebase !== "test-series" ||
            functions[0].source !== "features/test-series/cloud/functions" ||
            config.firestore?.rules !== "features/test-series/cloud/firestore.rules" ||
            config.emulators?.singleProjectMode !== true
          ) {
            throw new Error("CBT emulator config must contain only the isolated Test Series Functions codebase and CBT Firestore rules.");
          }
          console.log("Validated: Auth, Firestore and the Test Series Functions codebase only.");
          NODE

      - name: Install isolated CBT Functions dependencies
        working-directory: features/test-series/cloud/functions
        run: npm install --no-audit --no-fund

      - name: Check CBT Functions syntax
        working-directory: features/test-series/cloud/functions
        run: npm run lint

      - name: Check emulator backup fixture syntax
        run: node --check features/test-series/cloud/functions/tests/local-emulator-backup-restore-smoke.js

      - name: Run CBT unit and Firestore Rules emulator tests
        run: TEST_SERIES_ALLOW_CUSTOM_AUTH_FOR_EMULATOR=true npx --yes firebase-tools@latest emulators:exec --config firebase.test-series-cbt-emulator.json --project demo-railway-mitra-cbt --only auth,firestore,functions "npm --prefix features/test-series/cloud/functions test && node features/test-series/cloud/functions/tests/rules/firestore-rules-emulator.js"

      - name: Verify synthetic Auth and Firestore emulator backup/restore
        shell: bash
        run: |
          set -euo pipefail
          export_dir="${RUNNER_TEMP}/railway-mitra-cbt-emulator-export"
          rm -rf "$export_dir"
          GCLOUD_PROJECT=demo-railway-mitra-cbt npx --yes firebase-tools@latest emulators:exec --config firebase.test-series-cbt-emulator.json --project demo-railway-mitra-cbt --only auth,firestore --export-on-exit="$export_dir" "node features/test-series/cloud/functions/tests/local-emulator-backup-restore-smoke.js seed"
          test -f "$export_dir/firebase-export-metadata.json"
          GCLOUD_PROJECT=demo-railway-mitra-cbt npx --yes firebase-tools@latest emulators:exec --config firebase.test-series-cbt-emulator.json --project demo-railway-mitra-cbt --only auth,firestore --import="$export_dir" "node features/test-series/cloud/functions/tests/local-emulator-backup-restore-smoke.js verify"
          rm -rf "$export_dir"
