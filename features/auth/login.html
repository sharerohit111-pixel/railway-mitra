<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071326">
    <title>Railway Mitra - Mobile Login</title>

    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="./login.css">
</head>
<body>

    <main class="rm-login">
        <section class="rm-login-card">

            <a href="../../index.html" class="rm-login-back">
                ← वापस जाएँ
            </a>

            <div class="rm-login-logo">🚆</div>

            <h1>Railway Mitra</h1>
            <p class="rm-login-subtitle">
                आपका रेलवे डिजिटल साथी
            </p>

            <h2>Email ID से लॉगिन करें</h2>

            <form id="emailLoginForm">
                <label for="emailAddress">Email Address</label>
                <input type="email" id="emailAddress" placeholder="अपना ईमेल दर्ज करें" autocomplete="email" required>

                <label for="emailPassword" style="margin-top:14px;">Password</label>
                <input type="password" id="emailPassword" placeholder="अपना पासवर्ड दर्ज करें" autocomplete="current-password" required>

                <button type="submit" id="emailLoginBtn">Email से लॉगिन करें</button>
            </form>

            <div class="rm-login-divider"><span>या</span></div>

            <button type="button" id="googleLoginBtn" class="google-login-btn">G&nbsp; Google से लॉगिन करें</button>
            <button type="button" id="facebookLoginBtn" class="facebook-login-btn">f&nbsp; Facebook से लॉगिन करें</button>

            <details class="rm-phone-login-later">
                <summary>मोबाइल नंबर से लॉगिन (जल्द उपलब्ध होगा)</summary>
                <p>मोबाइल OTP लॉगिन सुविधा बाद में शुरू की जाएगी।</p>
            </details>

            <form id="phoneLoginForm" hidden>
                <label for="phoneNumber">मोबाइल नंबर</label>

                <div class="rm-phone-input">
                    <span>+91</span>
                    <input
                        type="tel"
                        id="phoneNumber"
                        placeholder="10 अंकों का मोबाइल नंबर"
                        inputmode="numeric"
                        maxlength="10"
                        required
                    >
                </div>

                <div id="recaptcha-container"></div>

                <button type="submit" id="sendOtpBtn">
                    OTP भेजें
                </button>
            </form>

            <form id="otpForm" hidden>
                <label for="otpCode">OTP दर्ज करें</label>

                <input
                    type="text"
                    id="otpCode"
                    placeholder="6 अंकों का OTP"
                    inputmode="numeric"
                    maxlength="6"
                    required
                >

                <button type="submit" id="verifyOtpBtn">
                    OTP सत्यापित करें
                </button>
            </form>

            <p id="loginMessage" role="status"></p>

            <p class="rm-login-security">
                🔒 आपकी जानकारी की सुरक्षा हमारी प्राथमिकता है।
            </p>

        </section>
    </main>

    <script type="module" src="./login.js"></script>

</body>
</html>
