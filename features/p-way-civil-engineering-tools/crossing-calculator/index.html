<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Railway Crossing Calculator</title>
  <style>
    :root {
      --banana: #facc15;
      --banana-dark: #eab308;
      --banana-soft: #fef9c3;
      --dark: #18181b;
      --slate: #27272a;
      --bg: #fffbeb;
      --card: #ffffff;
      --border: #fde047;
      --muted: #52525b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--dark); padding: 14px; line-height: 1.5; }
    .container { max-width: 850px; margin: 0 auto; }
    header {
      background: linear-gradient(135deg, var(--dark), var(--slate));
      color: #fff; padding: 18px 20px; border-radius: 14px; margin-bottom: 18px;
      border-bottom: 4px solid var(--banana); display: flex;
      justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    header h1 { font-size: 1.3rem; color: var(--banana); margin-bottom: 3px; }
    header p { font-size: 0.85rem; color: #e4e4e7; }
    .lang-box { display: flex; background: #3f3f46; padding: 4px; border-radius: 10px; gap: 4px; }
    .lang-btn {
      border: none; padding: 7px 14px; border-radius: 7px; font-weight: 800;
      font-size: 0.85rem; cursor: pointer; background: transparent; color: #fff;
    }
    .lang-btn.active { background: var(--banana); color: var(--dark); }
    .card {
      background: var(--card); border-radius: 14px; padding: 18px;
      margin-bottom: 18px; border: 2px solid var(--border);
      box-shadow: 0 4px 12px rgba(234, 179, 8, 0.12);
    }
    .card-title {
      font-size: 1.05rem; font-weight: 800; color: var(--dark);
      margin-bottom: 14px; padding-bottom: 8px; border-bottom: 2px dashed var(--banana-dark);
    }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .form-group { display: flex; flex-direction: column; }
    label { font-size: 0.82rem; font-weight: 700; margin-bottom: 5px; color: var(--slate); }
    select {
      padding: 10px 12px; border: 2px solid #e4e4e7; border-radius: 9px;
      font-size: 0.95rem; font-weight: 600; background: #fff; color: var(--dark);
    }
    .result-box {
      margin-top: 15px; background: var(--banana-soft);
      border-left: 6px solid var(--banana-dark); padding: 14px 16px;
      border-radius: 10px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between;
    }
    .result-item { display: flex; flex-direction: column; min-width: 130px; }
    .result-label { font-size: 0.75rem; color: var(--muted); font-weight: 800; text-transform: uppercase; }
    .result-value { font-size: 1.35rem; font-weight: 900; color: var(--dark); }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .tab-btn {
      padding: 8px 13px; border: 2px solid #e4e4e7; background: #fff;
      border-radius: 9px; cursor: pointer; font-weight: 700; font-size: 0.85rem; color: var(--slate);
    }
    .tab-btn.active { background: var(--banana); color: var(--dark); border-color: var(--banana-dark); }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.9rem; }
    th, td { border: 1px solid #fde68a; padding: 9px; text-align: center; }
    th { background: var(--banana-soft); color: var(--dark); font-weight: 800; }
    tr:nth-child(even) { background: #fffdf5; }
    .badge {
      display: inline-block; padding: 3px 10px; background: var(--dark);
      color: var(--banana); border-radius: 999px; font-weight: 800; font-size: 0.85rem;
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1 id="t_title">🍌 रेलवे क्रॉसिंग फिटिंग्स कैलकुलेटर</h1>
      <p id="t_sub">बोल्ट, रबर पैड, हील ब्लॉक, बियरिंग प्लेट और सुइयों की सटीक जानकारी</p>
    </div>
    <div class="lang-box">
      <button type="button" class="lang-btn active" id="btn_hi" onclick="changeLang('hi')">हिंदी</button>
      <button type="button" class="lang-btn" id="btn_en" onclick="changeLang('en')">English</button>
    </div>
  </header>

  <div class="card">
    <div class="card-title" id="t_boltCard">⚡ क्रॉसिंग बोल्ट क्विक लुकअप (बोल्ट खोजें)</div>
    <div class="grid-3">
      <div class="form-group">
        <label id="t_angle1">क्रॉसिंग एंगल (Angle)</label>
        <select id="b_angle" onchange="calcBolt()">
          <option value="1:12">1:12</option>
          <option value="1:8.5">1:8½</option>
        </select>
      </div>
      <div class="form-group">
        <label id="t_rail1">रेल सेक्शन (Rail Section)</label>
        <select id="b_rail" onchange="calcBolt()">
          <option value="60 Kg">60 Kg</option>
          <option value="52 Kg">52 Kg</option>
        </select>
      </div>
      <div class="form-group">
        <label id="t_serial">बोल्ट क्रम संख्या (1 - 12)</label>
        <select id="b_serial" onchange="calcBolt()">
          <option value="1">1</option><option value="2">2</option><option value="3">3</option>
          <option value="4">4</option><option value="5" selected>5</option><option value="6">6</option>
          <option value="7">7</option><option value="8">8</option><option value="9">9</option>
          <option value="10">10</option><option value="11">11</option><option value="12">12</option>
        </select>
      </div>
    </div>
    <div class="result-box">
      <div class="result-item">
        <span class="result-label" id="t_selLbl">चुना गया संयोजन</span>
        <span class="result-value" id="out_sel" style="font-size:1.05rem;">1:12 (60 Kg) - क्रम #5</span>
      </div>
      <div class="result-item">
        <span class="result-label" id="t_drgLbl">बोल्ट ड्राइंग नंबर</span>
        <span class="result-value" id="out_drg">11529</span>
      </div>
      <div class="result-item">
        <span class="result-label" id="t_sizeLbl">बोल्ट साइज़ (मि.मी.)</span>
        <span class="result-value" id="out_size">340 mm</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title" id="t_mainCard">📋 अन्य क्रॉसिंग फिटिंग्स विवरण</div>
    <div class="grid-3" style="margin-bottom:14px;">
      <div class="form-group">
        <label id="t_angle2">क्रॉसिंग एंगल (Angle)</label>
        <select id="m_angle" onchange="drawTable()">
          <option value="1:12">1:12</option>
          <option value="1:8.5">1:8½</option>
        </select>
      </div>
      <div class="form-group">
        <label id="t_rail2">रेल सेक्शन (Rail Section)</label>
        <select id="m_rail" onchange="drawTable()">
          <option value="60 Kg">60 Kg</option>
          <option value="52 Kg">52 Kg</option>
        </select>
      </div>
    </div>
    <div class="tabs">
      <button type="button" class="tab-btn active" id="tab_pads" onclick="openTab('pads', this)">रबर पैड</button>
      <button type="button" class="tab-btn" id="tab_heel" onclick="openTab('heel', this)">हील जोड़ गुटके व बोल्ट</button>
      <button type="button" class="tab-btn" id="tab_plates" onclick="openTab('plates', this)">स्पेशल बियरिंग प्लेट</button>
      <button type="button" class="tab-btn" id="tab_check" onclick="openTab('check', this)">चेक रेल व सुइयाँ</button>
    </div>
    <div id="table_area"></div>
  </div>
</div>
<script>
var TEXT = {
  hi: {
    title: "🍌 रेलवे क्रॉसिंग फिटिंग्स कैलकुलेटर",
    sub: "बोल्ट, रबर पैड, हील ब्लॉक, बियरिंग प्लेट और सुइयों की सटीक जानकारी",
    boltCard: "⚡ क्रॉसिंग बोल्ट क्विक लुकअप (बोल्ट खोजें)",

    rail: "रेल सेक्शन (Rail Section)",

    hSize: "साइज़ (मि.मी.)",
    hSI: "स्लीपर (SI)",
    hLeft: "लेफ्ट प्लेट (L)",
    hRight: "राइट प्लेट (R)",
    chkHead: "क्रॉसिंग के सामने चेक रेल के गुटका, बोल्ट व रबर पैड",

  },
  en: {
    title: "🍌 Railway Crossing Fittings Calculator",
    sub: "Exact lookup for Crossing Bolts, Rubber Pads, Heel Blocks, Plates & Needles",
    boltCard: "⚡ Crossing Bolt Quick Lookup",
    angle: "Crossing Angle",
    rail: "Rail Section",
    serial: "Bolt Serial No. (1 - 12)",
    selLbl: "Selected Combination",
    drgLbl: "Bolt Drawing No.",
    sizeLbl: "Bolt Size (mm)",
    wordSerial: "Serial",
    mainCard: "📋 Complete Crossing Fittings Details",
    tabPads: "Rubber Pads",
    tabHeel: "Heel Joint Blocks & Bolts",
    tabPlates: "Special Bearing Plates",
    tabCheck: "Check Rail & Needles",
    hSleeper: "Sleeper No.",
    hPad: "Rubber Pad No.",
    hPos: "Position",
    hBlock: "Block No.",
    hBolt: "Bolt Drawing No.",
    hSize: "Size (mm)",
    hSI: "Sleeper (SI)",
    hLeft: "Left Plate (L)",
    hRight: "Right Plate (R)",
    chkHead: "Check Rail Block, Bolt & Rubber Pad in front of Crossing",
    ndlHead: "Crossing Needles / Tongues (TOC & HOC)",
    pos: ["1st", "2nd", "3rd", "4th"]
  }
};

var DATA = {
  bolts: {
    "1:12": {
      "60 Kg": {
        1:{d:"11535",s:400},2:{d:"11533",s:380},3:{d:"11532",s:370},4:{d:"11531",s:360},
        5:{d:"11529",s:340},6:{d:"11528",s:330},7:{d:"11524",s:290},8:{d:"11525",s:300},
        9:{d:"11527",s:320},10:{d:"11528",s:330},11:{d:"11529",s:340},12:{d:"11531",s:360}
      },
      "52 Kg": {
        1:{d:"11534",s:390},2:{d:"11532",s:270},3:{d:"11531",s:360},4:{d:"11530",s:350},
        5:{d:"11528",s:330},6:{d:"11527",s:320},7:{d:"11524",s:290},8:{d:"11525",s:300},
        9:{d:"11527",s:320},10:{d:"11528",s:330},11:{d:"11529",s:340},12:{d:"11531",s:360}
      }
    },
    "1:8.5": {
      "60 Kg": {
        1:{d:"11536",s:410},2:{d:"11534",s:390},3:{d:"11532",s:370},4:{d:"11530",s:350},
        5:{d:"11528",s:330},6:{d:"11526",s:310},7:{d:"11525",s:300},8:{d:"11527",s:320},
        9:{d:"11529",s:340},10:{d:"11531",s:360},11:{d:"11533",s:380},12:{d:"11535",s:400}
      },
      "52 Kg": {
        1:{d:"11535",s:400},2:{d:"11533",s:380},3:{d:"11531",s:360},4:{d:"11529",s:340},
        5:{d:"11527",s:320},6:{d:"11526",s:310},7:{d:"11525",s:300},8:{d:"11527",s:320},
        9:{d:"11529",s:340},10:{d:"11531",s:360},11:{d:"11533",s:380},12:{d:"11535",s:400}
      }
    }
  },
  pads: {
    "1:12": [
      {sl:64,p:"6842"},{sl:65,p:"6845"},{sl:66,p:"6204"},{sl:67,p:"6205"},{sl:68,p:"6206"},
      {sl:69,p:"6207"},{sl:70,p:"6208"},{sl:71,p:"6209"},{sl:72,p:"6210"},{sl:73,p:"6211"},
      {sl:74,p:"6846"},{sl:75,p:"6843"},{sl:76,p:"6844"}
    ],
    "1:8.5": [
      {sl:41,p:"6800/1"},{sl:42,p:"6800"},{sl:43,p:"6198"},{sl:44,p:"6199"},{sl:45,p:"6200"},
      {sl:46,p:"6201"},{sl:47,p:"6202"},{sl:48,p:"6203"},{sl:49,p:"6601"},{sl:50,p:"6801/1"}
    ]
  },
  heel: {
    "1:12": {
      "60 Kg": [{b:"2611",bt:"11522",sz:"270"},{b:"2612",bt:"11526",sz:"310"},{b:"4359",bt:"11531",sz:"360"},{b:"4360",bt:"11533",sz:"380"}],
      "52 Kg": [{b:"4760",bt:"11522",sz:"270"},{b:"4761",bt:"11525",sz:"300"},{b:"4762",bt:"11531",sz:"360"},{b:"4763",bt:"11533",sz:"380"}]
    },
    "1:8.5": {
      "60 Kg": [{b:"4978",bt:"11522",sz:"270"},{b:"4979",bt:"11526",sz:"310"},{b:"4880",bt:"11521",sz:"310"},{b:"-",bt:"-",sz:"-"}],
      "52 Kg": [{b:"15561",bt:"11522",sz:"270"},{b:"15562",bt:"11525",sz:"300"},{b:"4878",bt:"-",sz:"360"},{b:"-",bt:"-",sz:"-"}]
    }
  },
  plates: {
    "1:12": {
      "60 Kg": [{si:21,p:"4611",l:"4597",r:"-"},{si:22,p:"4612",l:"4604",r:"-"},{si:23,p:"4612",l:"4605",r:"-"},{si:24,p:"4612",l:"4606",r:"-"},{si:25,p:"4613",l:"4607",r:"-"},{si:26,p:"4613",l:"4608",r:"-"},{si:27,p:"4613",l:"4609",r:"-"}],
      "52 Kg": [{si:21,p:"-",l:"4726",r:"4736"},{si:22,p:"-",l:"4743",r:"4737"},{si:23,p:"-",l:"4744",r:"4738"},{si:24,p:"-",l:"4745",r:"8016"},{si:25,p:"-",l:"8314",r:"8017"},{si:26,p:"-",l:"8315",r:"8018"},{si:27,p:"-",l:"8316",r:"8019"}]
    },
    "1:8.5": {
      "60 Kg": [{si:14,p:"4876",l:"4974",r:"-"},{si:15,p:"4876",l:"4975",r:"-"},{si:16,p:"4876",l:"4976",r:"-"}],
      "52 Kg": [{si:14,p:"-",l:"4872",r:"4869"},{si:15,p:"-",l:"4873",r:"4870"},{si:16,p:"-",l:"4874",r:"4871"}]
    }
  },
  check: {
    "60 Kg": {p:"8294",b:"2082",bt:"11514",sz:"190 mm"},
    "52 Kg": {p:"8294",b:"4774",bt:"11513",sz:"180 mm"}
  },
  needles: {
    "1:12": { "60 Kg": {toc:"4121",hoc:"2716"}, "52 Kg": {toc:"4775",hoc:"4776"} },
    "1:8.5": { "60 Kg": {toc:"4987",hoc:"4988"}, "52 Kg": {toc:"4894",hoc:"4895"} }
  }
};
var lang = "hi";
var curTab = "pads";

function changeLang(l) {
  lang = l;
  var t = TEXT[l];
  document.getElementById("btn_hi").className = l === "hi" ? "lang-btn active" : "lang-btn";
  document.getElementById("btn_en").className = l === "en" ? "lang-btn active" : "lang-btn";
  document.getElementById("t_title").textContent = t.title;
  document.getElementById("t_sub").textContent = t.sub;
  document.getElementById("t_boltCard").textContent = t.boltCard;
  document.getElementById("t_angle1").textContent = t.angle;
  document.getElementById("t_rail1").textContent = t.rail;
  document.getElementById("t_serial").textContent = t.serial;
  document.getElementById("t_selLbl").textContent = t.selLbl;
  document.getElementById("t_drgLbl").textContent = t.drgLbl;
  document.getElementById("t_sizeLbl").textContent = t.sizeLbl;
  document.getElementById("t_mainCard").textContent = t.mainCard;
  document.getElementById("t_angle2").textContent = t.angle;
  document.getElementById("t_rail2").textContent = t.rail;
  document.getElementById("tab_pads").textContent = t.tabPads;
  document.getElementById("tab_heel").textContent = t.tabHeel;
  document.getElementById("tab_plates").textContent = t.tabPlates;
  document.getElementById("tab_check").textContent = t.tabCheck;
  calcBolt();
  drawTable();
}

function calcBolt() {
  var a = document.getElementById("b_angle").value;
  var r = document.getElementById("b_rail").value;
  var s = document.getElementById("b_serial").value;
  var res = DATA.bolts[a][r][s];
  var t = TEXT[lang];
  var angShow = a === "1:8.5" ? "1:8½" : a;
  document.getElementById("out_sel").textContent = angShow + " (" + r + ") - " + t.wordSerial + " #" + s;
  document.getElementById("out_drg").textContent = res.d;
  document.getElementById("out_size").textContent = res.s + " mm";
}

function openTab(tabName, el) {
  curTab = tabName;
  var btns = document.querySelectorAll(".tab-btn");
  for (var i = 0; i < btns.length; i++) btns[i].className = "tab-btn";
  el.className = "tab-btn active";
  drawTable();
}

function drawTable() {
  var a = document.getElementById("m_angle").value;
  var r = document.getElementById("m_rail").value;
  var t = TEXT[lang];
  var box = document.getElementById("table_area");
  var html = "";

  if (curTab === "pads") {
    html = "<table><thead><tr><th>" + t.hSleeper + "</th><th>" + t.hPad + "</th></tr></thead><tbody>";
    var list = DATA.pads[a];
    for (var i = 0; i < list.length; i++) {
      html += "<tr><td><strong>" + list[i].sl + "</strong></td><td><span class='badge'>" + list[i].p + "</span></td></tr>";
    }
    html += "</tbody></table>";
  } else if (curTab === "heel") {
    html = "<table><thead><tr><th>" + t.hPos + "</th><th>" + t.hBlock + "</th><th>" + t.hBolt + "</th><th>" + t.hSize + "</th></tr></thead><tbody>";
    var list = DATA.heel[a][r];
    for (var i = 0; i < list.length; i++) {
      html += "<tr><td><strong>" + t.pos[i] + "</strong></td><td>" + list[i].b + "</td><td><span class='badge'>" + list[i].bt + "</span></td><td>" + list[i].sz + "</td></tr>";
    }
    html += "</tbody></table>";
  } else if (curTab === "plates") {
    html = "<table><thead><tr><th>" + t.hSI + "</th><th>" + t.hPad + "</th><th>" + t.hLeft + "</th><th>" + t.hRight + "</th></tr></thead><tbody>";
    var list = DATA.plates[a][r];
    for (var i = 0; i < list.length; i++) {
      var rCol = list[i].r !== "-" ? "<span class='badge'>" + list[i].r + "</span>" : "-";
      html += "<tr><td><strong>" + list[i].si + "</strong></td><td>" + list[i].p + "</td><td><span class='badge'>" + list[i].l + "</span></td><td>" + rCol + "</td></tr>";
    }
    html += "</tbody></table>";
  } else {
    var c = DATA.check[r];
    var n = DATA.needles[a][r];
    html = "<h4 style='margin:10px 0;color:#18181b'>" + t.chkHead + " (" + r + ")</h4>" +
      "<table><thead><tr><th>" + t.hPad + "</th><th>" + t.hBlock + "</th><th>" + t.hBolt + "</th><th>" + t.hSize + "</th></tr></thead>" +
      "<tbody><tr><td><span class='badge'>" + c.p + "</span></td><td><span class='badge'>" + c.b + "</span></td><td><span class='badge'>" + c.bt + "</span></td><td><strong>" + c.sz + "</strong></td></tr></tbody></table>" +
      "<h4 style='margin:18px 0 10px;color:#18181b'>" + t.ndlHead + "</h4>" +
      "<table><thead><tr><th>TOC (Toe of Crossing)</th><th>HOC (Heel of Crossing)</th></tr></thead>" +
      "<tbody><tr><td><span class='badge'>" + n.toc + "</span></td><td><span class='badge'>" + n.hoc + "</span></td></tr></tbody></table>";
  }
  box.innerHTML = html;
}

changeLang("hi");
</script>
</body>
</html>
