<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zone-Wise LWR Rail Temp & Patrolling - Railway Mitra</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-bar">
  <span class="tag">IRPWM LWR Zone Tool</span>
  <button class="lang-btn" onclick="toggleLang()" id="langBtn">English</button>
</div>

<div class="card">
  <h2 id="mainTitle">🌡️ जोन-वाइज LWR तापमान और पेट्रोलिंग</h2>
  <p class="sub" id="subTitle">IRPWM के 4 तापमान जोन (Zone I–IV) के अनुसार td और पेट्रोलिंग की स्थिति जांचें</p>

  <label id="zoneLabel">1. रेलवे तापमान जोन चुनें (Temperature Zone):</label>
  <select id="tempZone" onchange="updateZoneInfo()">
    <option value="1" id="optZ1">Zone I (वार्षिक अंतर: 40°C – 50°C | तटीय क्षेत्र)</option>
    <option value="2" id="optZ2">Zone II (वार्षिक अंतर: 51°C – 60°C | दक्षिण/मध्य)</option>
    <option value="3" selected id="optZ3">Zone III (वार्षिक अंतर: 61°C – 70°C | उत्तर/पश्चिम)</option>
    <option value="4" id="optZ4">Zone IV (वार्षिक अंतर: 71°C – 76°C | अत्यधिक ठंड/गर्मी)</option>
  </select>

  <label id="tmLabel">2. क्षेत्र का मीन रेल तापमान (Mean Rail Temp - tm °C):</label>
  <input type="number" step="0.5" id="tmTemp" placeholder="जैसे: 38">

  <label id="tdLabel">3. डिस्ट्रेसिंग तापमान (Destressing Temp - td °C):</label>
  <input type="number" step="0.5" id="tdTemp" placeholder="जैसे: 42">

  <label id="currLabel">4. मौजूदा रेल तापमान (Current Rail Temp °C):</label>
  <input type="number" step="0.5" id="currTemp" placeholder="जैसे: 64">

  <button class="calc-btn" onclick="calculateZoneLWR()" id="calcBtn">पेट्रोलिंग स्थिति जांचें (Check Status)</button>

  <div class="result-box" id="resultBox">
    <div id="tdValidationBox" style="margin-bottom: 12px;"></div>
    <div class="res-label" id="resDiffLabel">डिस्ट्रेसिंग तापमान से अंतर (ΔT = Curr - td):</div>
    <div class="result-val" id="diffOutput">0 °C</div>
    <div id="patrollingDecisionBox" class="decision-box"></div>
    <div id="limitDetails" class="extra-details"></div>
  </div>
</div>

<div class="card info-box" id="zoneRulesBox"></div>
<div class="disclaimer-box" id="disclaimerBox"></div>

<script src="script.js"></script>
</body>
</html>
