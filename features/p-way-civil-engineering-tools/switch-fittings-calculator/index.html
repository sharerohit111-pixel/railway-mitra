<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Railway Switch Fittings Calculator</title>
  <style>
    :root {
      --banana: #facc15;
      --banana-dark: #eab308;
      --banana-soft: #fef9c3;
      --dark: #18181b;
      --slate: #27272a;
      --bg: #fffbeb;
      --card: #ffffff;
      --border: #fde047;
      --muted: #52525b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--dark); padding: 14px; line-height: 1.5; }
    .container { max-width: 850px; margin: 0 auto; }
    header {
      background: linear-gradient(135deg, var(--dark), var(--slate));
      color: #fff; padding: 18px 20px; border-radius: 14px; margin-bottom: 18px;
      border-bottom: 4px solid var(--banana); display: flex;
      justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    header h1 { font-size: 1.3rem; color: var(--banana); margin-bottom: 3px; }
    header p { font-size: 0.85rem; color: #e4e4e7; }
    .lang-box { display: flex; background: #3f3f46; padding: 4px; border-radius: 10px; gap: 4px; }
    .lang-btn {
      border: none; padding: 7px 14px; border-radius: 7px; font-weight: 800;
      font-size: 0.85rem; cursor: pointer; background: transparent; color: #fff;
    }
    .lang-btn.active { background: var(--banana); color: var(--dark); }
    .card {
      background: var(--card); border-radius: 14px; padding: 18px;
      margin-bottom: 18px; border: 2px solid var(--border);
      box-shadow: 0 4px 12px rgba(234, 179, 8, 0.12);
    }
    .card-title {
      font-size: 1.05rem; font-weight: 800; color: var(--dark);
      margin-bottom: 14px; padding-bottom: 8px; border-bottom: 2px dashed var(--banana-dark);
    }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .form-group { display: flex; flex-direction: column; }
    label { font-size: 0.82rem; font-weight: 700; margin-bottom: 5px; color: var(--slate); }
    select {
      padding: 10px 12px; border: 2px solid #e4e4e7; border-radius: 9px;
      font-size: 0.95rem; font-weight: 600; background: #fff; color: var(--dark);
    }
    .result-box {
      margin-top: 15px; background: var(--banana-soft);
      border-left: 6px solid var(--banana-dark); padding: 14px 16px;
      border-radius: 10px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between;
    }
    .result-item { display: flex; flex-direction: column; min-width: 130px; }
    .result-label { font-size: 0.75rem; color: var(--muted); font-weight: 800; text-transform: uppercase; }
    .result-value { font-size: 1.25rem; font-weight: 900; color: var(--dark); }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .tab-btn {
      padding: 8px 13px; border: 2px solid #e4e4e7; background: #fff;
      border-radius: 9px; cursor: pointer; font-weight: 700; font-size: 0.85rem; color: var(--slate);
    }
    .tab-btn.active { background: var(--banana); color: var(--dark); border-color: var(--banana-dark); }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.9rem; }
    th, td { border: 1px solid #fde68a; padding: 9px; text-align: center; }
    th { background: var(--banana-soft); color: var(--dark); font-weight: 800; }
    tr:nth-child(even) { background: #fffdf5; }
    .badge {
      display: inline-block; padding: 3px 10px; background: var(--dark);
      color: var(--banana); border-radius: 999px; font-weight: 800; font-size: 0.85rem;
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1 id="t_title">🍌 रेलवे स्विच फिटिंग्स कैलकुलेटर</h1>
      <p id="t_sub">स्ट्रेचर बार, स्लाइड चेयर, स्पेशल प्लेट और हील ब्लॉक की सटीक जानकारी</p>
    </div>
    <div class="lang-box">
      <button type="button" class="lang-btn active" id="btn_hi" onclick="changeLang('hi')">हिंदी</button>
      <button type="button" class="lang-btn" id="btn_en" onclick="changeLang('en')">English</button>
    </div>
  </header>

  <div class="card">
    <div class="card-title" id="t_barCard">⚡ स्ट्रेचर बार क्विक लुकअप (Stretcher Bar खोजें)</div>
    <div class="grid-3">
      <div class="form-group">
        <label id="t_angle1">स्विच एंगल (Switch Angle)</label>
        <select id="s_angle" onchange="calcBar()">
          <option value="1:12">1:12 (10125 mm)</option>
          <option value="1:8.5">1:8½ (6400 mm)</option>
        </select>
      </div>
      <div class="form-group">
        <label id="t_rail1">रेल सेक्शन (Rail Section)</label>
        <select id="s_rail" onchange="calcBar()">
          <option value="60 Kg">60 Kg</option>
          <option value="52 Kg">52 Kg</option>
        </select>
      </div>
      <div class="form-group">
        <label id="t_barPos">स्ट्रेचर बार प्रकार (Position)</label>
        <select id="s_pos" onchange="calcBar()">
          <option value="lead" id="opt_lead">लीडिंग (Leading Bar)</option>
          <option value="f1" id="opt_f1">पहला फॉलोइंग (1st Following)</option>
          <option value="f2" id="opt_f2">दूसरा फॉलोइंग (2nd Following)</option>
          <option value="f3" id="opt_f3">तीसरा फॉलोइंग (3rd Following)</option>
        </select>
      </div>
    </div>
    <div class="result-box">
      <div class="result-item">
        <span class="result-label" id="t_drgLbl">RDSO ड्राइंग नंबर (Insulated)</span>
        <span class="result-value" id="out_drg">RT-3649 / 3650</span>
      </div>
      <div class="result-item">
        <span class="result-label" id="t_locLbl">स्लीपर स्थान (Location)</span>
        <span class="result-value" id="out_loc">Sl. 3 - 4</span>
      </div>
      <div class="result-item">
        <span class="result-label" id="t_distLbl">ATS से दूरी (Distance)</span>
        <span class="result-value" id="out_dist">465 mm</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title" id="t_mainCard">📋 संपूर्ण स्विच फिटिंग्स विवरण</div>
    <div class="grid-3" style="margin-bottom:14px;">
      <div class="form-group">
        <label id="t_angle2">स्विच एंगल (Switch Angle)</label>
        <select id="m_angle" onchange="drawTable()">
          <option value="1:12">1:12 (Curved Over-riding)</option>
          <option value="1:8.5">1:8½ (Curved Over-riding)</option>
        </select>
      </div>
      <div class="form-group">
        <label id="t_rail2">रेल सेक्शन (Rail Section)</label>
        <select id="m_rail" onchange="drawTable()">
          <option value="60 Kg">60 Kg</option>
          <option value="52 Kg">52 Kg</option>
        </select>
      </div>
    </div>
    <div class="tabs">
      <button type="button" class="tab-btn active" id="tab_bars" onclick="openTab('bars', this)">स्ट्रेचर बार</button>
      <button type="button" class="tab-btn" id="tab_chairs" onclick="openTab('chairs', this)">स्लाइड चेयर</button>
      <button type="button" class="tab-btn" id="tab_plates" onclick="openTab('plates', this)">स्पेशल बियरिंग प्लेट</button>
      <button type="button" class="tab-btn" id="tab_specs" onclick="openTab('specs', this)">मुख्य माप व टंग रेल</button>
    </div>
    <div id="table_area"></div>
  </div>
</div>

function changeLang(l) {
  lang = l;
  var t = TEXT[l];
  document.getElementById("btn_hi").className = l === "hi" ? "lang-btn active" : "lang-btn";
  document.getElementById("btn_en").className = l === "en" ? "lang-btn active" : "lang-btn";

  document.getElementById("t_sub").textContent = t.sub;
  document.getElementById("t_barCard").textContent = t.barCard;
  document.getElementById("t_angle1").textContent = t.angle;
  document.getElementById("t_rail1").textContent = t.rail;
  document.getElementById("t_barPos").textContent = t.barPos;
  document.getElementById("opt_lead").textContent = t.optLead;

  document.getElementById("opt_f2").textContent = t.optF2;
  document.getElementById("opt_f3").textContent = t.optF3;
  document.getElementById("t_drgLbl").textContent = t.drgLbl;
  document.getElementById("t_locLbl").textContent = t.locLbl;
  document.getElementById("t_distLbl").textContent = t.distLbl;
  document.getElementById("t_mainCard").textContent = t.mainCard;
  document.getElementById("t_angle2").textContent = t.angle;
  document.getElementById("t_rail2").textContent = t.rail;
  document.getElementById("tab_bars").textContent = t.tabBars;
  document.getElementById("tab_chairs").textContent = t.tabChairs;
  document.getElementById("tab_plates").textContent = t.tabPlates;
  document.getElementById("tab_specs").textContent = t.tabSpecs;
  calcBar();
  drawTable();
}

function calcBar() {
  var a = document.getElementById("s_angle").value;
  var r = document.getElementById("s_rail").value;
  var p = document.getElementById("s_pos").value;
  var res = DATA.bars[a][r][p];
  var t = TEXT[lang];
  document.getElementById("out_drg").textContent = res.drg === "N/A" ? t.notUsed : res.drg;
  document.getElementById("out_loc").textContent = res.loc;
  document.getElementById("out_dist").textContent = res.dist;
}

function openTab(tabName, el) {
  curTab = tabName;
  var btns = document.querySelectorAll(".tab-btn");
  for (var i = 0; i < btns.length; i++) btns[i].className = "tab-btn";
  el.className = "tab-btn active";
  drawTable();
}

function drawTable() {
  var a = document.getElementById("m_angle").value;
  var r = document.getElementById("m_rail").value;
  var t = TEXT[lang];
  var box = document.getElementById("table_area");
  var html = "";

  if (curTab === "bars") {
    var keys = ["lead", "f1", "f2", "f3"];
    html = "<table><thead><tr><th>" + t.hType + "</th><th>" + t.hDrg + "</th><th>" + t.hSl + "</th><th>" + t.hDist + "</th></tr></thead><tbody>";
    for (var i = 0; i < keys.length; i++) {
      var item = DATA.bars[a][r][keys[i]];
      var drgVal = item.drg === "N/A" ? t.notUsed : "<span class='badge'>" + item.drg + "</span>";
      html += "<tr><td><strong>" + t.barNames[i] + "</strong></td><td>" + drgVal + "</td><td>" + item.loc + "</td><td>" + item.dist + "</td></tr>";
    }
    html += "</tbody></table>";
  } else if (curTab === "chairs") {
    var list = DATA.chairs[a][r];
    html = "<table><thead><tr><th>" + t.hItem + "</th><th>" + t.hDrg + "</th><th>" + t.hQty + "</th></tr></thead><tbody>";
    for (var i = 0; i < list.length; i++) {
      html += "<tr><td><strong>" + list[i].name + "</strong></td><td><span class='badge'>" + list[i].drg + "</span></td><td>" + list[i].qty + "</td></tr>";
    }
    html += "</tbody></table>";
  } else if (curTab === "plates") {
    var list = DATA.plates[a][r];
    html = "<table><thead><tr><th>" + t.hSl + "</th><th>" + t.hDrg + "</th><th>Side</th></tr></thead><tbody>";
    for (var i = 0; i < list.length; i++) {
      html += "<tr><td><strong>" + list[i].sl + "</strong></td><td><span class='badge'>" + list[i].drg + "</span></td><td>" + list[i].side + "</td></tr>";
    }
    html += "</tbody></table>";
  } else {
    var list = DATA.specs[a][r];
    html = "<table><thead><tr><th>" + t.hSpec + "</th><th>" + t.hVal + "</th></tr></thead><tbody>";
    for (var i = 0; i < list.length; i++) {
      html += "<tr><td><strong>" + list[i].p + "</strong></td><td><span class='badge'>" + list[i].v + "</span></td></tr>";
    }
    html += "</tbody></table>";
  }
  box.innerHTML = html;
}

changeLang("hi");
