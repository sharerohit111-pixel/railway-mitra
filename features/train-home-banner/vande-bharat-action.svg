<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Vande Bharat inspired train in motion</title><desc id="desc">A modern white and blue high-speed Indian train races along railway tracks at sunset.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#102d5c"/><stop offset=".55" stop-color="#7b4a73"/><stop offset="1" stop-color="#f4a45c"/></linearGradient>
 <linearGradient id="body" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".55" stop-color="#dcecff"/><stop offset="1" stop-color="#8daacb"/></linearGradient>
 <linearGradient id="blue" x2="1"><stop stop-color="#062b62"/><stop offset=".55" stop-color="#087fc1"/><stop offset="1" stop-color="#04224d"/></linearGradient>
 <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#b7f5ff"/><stop offset=".5" stop-color="#1b4777"/><stop offset="1" stop-color="#06182e"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="1200" height="420" fill="url(#sky)"/>
